agents:
  my_agent:
    llm: openai
    # Example MCP server config
    mcp_servers:
      math_server:
        command: "python"
        args: ["math_server.py"]
        transport: "stdio"
      weather_server:
        url: "http://localhost:8000/mcp/"
        transport: "streamable_http"
    tools:            # if you want additional tools local to your app
      - "my_tools_module:some_tool_function"
